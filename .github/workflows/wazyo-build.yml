name: WAZYO build

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "smart-luxy-app/**"
      - ".github/workflows/wazyo-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "smart-luxy-app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-luxy-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wazyo-package-lock
          path: smart-luxy-app/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build storefront
        run: npm run build
